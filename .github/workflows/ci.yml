name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the four independent platform wheels from the checkout
        run: python -m pip install ./engineering_registry ./engineering_execution ./engineering_document_ai_brain ./engineering_ai_reviewer
      - name: Install Engineering AI System and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check --extend-ignore I001,UP017,UP035,UP045 .
      - name: Run tests
        run: python -m pytest -q
      - name: Verify independent platform packages
        run: python scripts/verify_platform_packages.py
      - name: Compile source modules
        run: python -m compileall -q pipelines agents evals engineering_registry engineering_execution engineering_document_ai_brain engineering_ai_reviewer engineering_ai_system
