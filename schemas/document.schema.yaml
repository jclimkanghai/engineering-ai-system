version: 1

document_schema:

  identity:

    document_id:
      type: string
      required: true
      description: "Unique stable identifier for the document."

    title:
      type: string
      required: true
      description: "Document title."

    document_number:
      type: string
      required: false
      description: "Controlled document number, drawing number, specification number or equivalent identifier."

    document_type:
      type: string
      required: true
      description: "Document type from config/document_types.yaml."

    discipline:
      type: array
      items: string
      required: false
      description: "One or more engineering or project disciplines from config/disciplines.yaml."

  revision:

    revision:
      type: string
      required: false
      description: "Document revision identifier."

    revision_date:
      type: date
      required: false
      description: "Date associated with the revision."

    issue_status:
      type: string
      required: false
      allowed:
        - draft
        - preliminary
        - issued
        - issued_for_review
        - issued_for_approval
        - approved
        - approved_for_construction
        - as_built
        - superseded
        - cancelled
        - unknown

    supersedes:
      type: array
      items: string
      required: false
      description: "Document IDs or revisions explicitly superseded by this document."

    superseded_by:
      type: array
      items: string
      required: false
      description: "Later document IDs or revisions that supersede this document."

    governing_status:
      type: string
      required: false
      allowed:
        - governing
        - potentially_governing
        - superseded
        - reference_only
        - unknown
      description: "Current assessment of whether this document governs the relevant requirement."

  source:

    source_file:
      type: string
      required: true
      description: "Original source filename."

    source_path:
      type: string
      required: false
      description: "Path or URI of the source document within the approved document repository."

    source_system:
      type: string
      required: false
      description: "System from which the document originated."

    source_hash:
      type: string
      required: false
      description: "Cryptographic hash used to identify the exact source file."

    ingestion_timestamp:
      type: datetime
      required: true
      description: "Time at which the document was ingested."

    ingestion_method:
      type: string
      required: true
      allowed:
        - docling
        - ocr
        - manual
        - api
        - other

  authorship:

    author:
      type: string
      required: false

    organization:
      type: string
      required: false

    checker:
      type: string
      required: false

    approver:
      type: string
      required: false

  project:

    project_name:
      type: string
      required: false

    project_number:
      type: string
      required: false

    client:
      type: string
      required: false

    contractor:
      type: string
      required: false

    consultant:
      type: string
      required: false

    location:
      type: string
      required: false

  content:

    page_count:
      type: integer
      required: false

    section_count:
      type: integer
      required: false

    table_count:
      type: integer
      required: false

    figure_count:
      type: integer
      required: false

    drawing_count:
      type: integer
      required: false

    language:
      type: array
      items: string
      required: false

    extracted_text:
      type: string
      required: false
      description: "Normalized text extracted from the document."

    structured_content:
      type: object
      required: false
      description: "Structured representation generated by the document processing layer."

  provenance:

    extraction_engine:
      type: string
      required: false
      description: "Document extraction or processing engine used."

    extraction_version:
      type: string
      required: false

    extraction_quality:
      type: string
      required: false
      allowed:
        - high
        - medium
        - low
        - failed
        - unknown

    ocr_used:
      type: boolean
      required: false

    table_extraction_quality:
      type: string
      required: false
      allowed:
        - high
        - medium
        - low
        - failed
        - not_applicable
        - unknown

  classification:

    confidentiality:
      type: string
      required: false
      allowed:
        - public
        - internal
        - confidential
        - restricted
        - unknown

    sensitivity:
      type: string
      required: false
      allowed:
        - normal
        - sensitive
        - commercially_sensitive
        - security_sensitive
        - personal_data
        - unknown

    review_priority:
      type: string
      required: false
      allowed:
        - low
        - medium
        - high
        - critical

  relationships:

    parent_document:
      type: string
      required: false
      description: "Document ID of the parent or controlling document."

    related_documents:
      type: array
      items: string
      required: false

    referenced_documents:
      type: array
      items: string
      required: false

    referenced_standards:
      type: array
      items: string
      required: false

  review:

    review_status:
      type: string
      required: false
      allowed:
        - not_reviewed
        - processing
        - reviewed
        - reviewed_with_findings
        - requires_human_review
        - unable_to_process

    reviewer:
      type: string
      required: false

    last_reviewed:
      type: datetime
      required: false

    finding_count:
      type: integer
      required: false

    risk_count:
      type: integer
      required: false

    unresolved_issue_count:
      type: integer
      required: false
